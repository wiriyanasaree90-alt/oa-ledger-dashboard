<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>OA Ledger — มอนิเตอร์</title>
<style>
  :root {
    --bg: #0B0E1A;
    --panel: #151833;
    --panel2: #1C2044;
    --gold: #FFD873;
    --gold-dim: #B8860B;
    --red: #FF4757;
    --blue: #38BDF8;
    --white: #F5F5F7;
    --muted: #9AA0B4;
    --loss: #F87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse at top, #171B37 0%, var(--bg) 55%),
      var(--bg);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Sarabun, sans-serif;
    padding: 16px;
    padding-bottom: 260px;
  }

  /* ---------------- header / brand ---------------- */
  .title-wrap { text-align: center; margin: 4px 0 16px; }
  .brand-title {
    display: inline-block;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #B8860B, #FFF3C4, #FFD873, #FFF3C4, #B8860B);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
    filter: drop-shadow(0 0 10px rgba(255, 216, 115, 0.45));
  }
  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 300% center; }
  }
  .brand-sub {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .live-row {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 8px; font-size: 11px; color: var(--muted); letter-spacing: 1px;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 8px var(--red);
    animation: blink 1.3s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

  /* ---------------- main card ---------------- */
  .card {
    background: linear-gradient(180deg, #12142A, #0B0E1A);
    border: 1px solid var(--gold);
    border-radius: 18px;
    padding: 18px;
    max-width: 480px;
    margin: 0 auto 16px;
    animation: cardGlow 3.2s ease-in-out infinite;
  }
  @keyframes cardGlow {
    0%, 100% { box-shadow: 0 0 10px rgba(255, 216, 115, 0.12), inset 0 0 20px rgba(255, 216, 115, 0.02); }
    50% { box-shadow: 0 0 26px rgba(255, 216, 115, 0.35), inset 0 0 20px rgba(255, 216, 115, 0.06); }
  }
  .pl-box { background: var(--panel); border-radius: 12px; padding: 16px; border: 1px solid #24284d; }
  .pl-label { color: var(--gold); font-weight: bold; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
  .pl-value {
    font-size: 42px; font-weight: 800; margin-top: 6px;
    text-shadow: 0 0 16px currentColor;
  }
  .session-label { color: var(--muted); font-size: 12px; margin-top: 8px; }
  hr { border: none; border-top: 1px solid #2A2E4A; margin: 16px 0; }
  .log-box { background: var(--panel); border: 1px solid #24284d; border-radius: 10px; padding: 12px; }
  .log-title { color: var(--gold); font-size: 11px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
  .log-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; border-bottom: 1px solid #1c2044; }
  .log-row:last-child { border-bottom: none; }
  .dot { flex: 0 0 auto; font-size: 12px; }
  .dot.red { color: var(--red); text-shadow: 0 0 6px var(--red); }
  .dot.blue { color: var(--blue); text-shadow: 0 0 6px var(--blue); }
  .log-text { flex: 3; word-break: break-word; }
  .log-name { flex: 2; color: var(--gold); text-align: right; word-break: break-word; }
  .cancel-entry-btn {
    flex: 0 0 auto; background: transparent; border: 1px solid var(--red); color: var(--red);
    border-radius: 6px; font-size: 10px; padding: 4px 7px; font-weight: 700; letter-spacing: 0.5px;
  }
  .cancel-entry-btn:active { background: var(--red); color: var(--white); }
  .footer-row { display: flex; justify-content: space-between; margin-top: 14px; font-weight: bold; font-size: 15px; }
  .footer-row .red { color: var(--red); text-shadow: 0 0 8px rgba(255, 71, 87, 0.5); }
  .footer-row .blue { color: var(--blue); text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
  .empty { color: var(--muted); font-size: 13px; }
  .inactive { text-align: center; color: var(--muted); padding: 40px 16px; }

  /* ---------------- action buttons (ST / ด / น / สม / End) ---------------- */
  .action-panel {
    width: 100%; max-width: 480px; margin: 0 auto 12px;
    background: linear-gradient(180deg, #12142A, #0B0E1A);
    border: 1px solid #2A2E4A; border-radius: 14px; padding: 12px;
  }
  .action-panel-title {
    color: var(--muted); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    text-align: center; margin-bottom: 10px;
  }
  .action-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .action-btn {
    border-radius: 10px; padding: 10px 2px; font-weight: 800; font-size: 11px;
    letter-spacing: 0.5px; text-transform: uppercase; border: 1px solid var(--gold);
    background: linear-gradient(180deg, #1c1f3d, #0f1226); color: var(--gold);
    transition: transform 0.1s ease;
  }
  .action-btn:active { transform: scale(0.95); }
  .action-btn.start { color: #1a1400; background: linear-gradient(180deg, #FFE9A8, #D9A93A); border-color: #D9A93A;
    box-shadow: 0 0 12px rgba(217, 169, 58, 0.5); }
  .action-btn.red { border-color: var(--red); color: var(--red); }
  .action-btn.blue { border-color: var(--blue); color: var(--blue); }
  .action-btn.draw { border-color: var(--muted); color: var(--white); }
  .action-btn.end { border-color: var(--gold-dim); color: var(--gold); }

  /* ---------------- person-summary shortcut button ---------------- */
  .person-summary-btn {
    width: 100%; max-width: 480px; margin: 0 auto 12px; display: block;
    background: linear-gradient(180deg, #1c1f3d, #0f1226); color: var(--gold);
    border: 1px solid var(--gold); border-radius: 12px; padding: 12px;
    font-weight: 800; font-size: 13px; letter-spacing: 0.5px;
  }
  .person-summary-btn:active { transform: scale(0.98); }

  /* ---------------- editable name (pencil button next to a name) ---------------- */
  .edit-name-btn {
    flex: 0 0 auto; background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
    border-radius: 6px; font-size: 11px; padding: 3px 6px; line-height: 1;
  }
  .edit-name-btn:active { background: var(--gold); color: #1a1400; }
  .rename-input-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .rename-input-row input {
    flex: 1; background: var(--bg); border: 1px solid var(--gold); border-radius: 8px;
    color: var(--white); padding: 10px 12px; font-size: 15px;
  }

  /* ---------------- per-person summary modal ---------------- */
  .person-group { border-bottom: 1px dashed #2A2E4A; padding: 10px 0; }
  .person-group:last-child { border-bottom: none; }
  .person-group-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .person-group-name { font-weight: 800; font-size: 14px; color: var(--white); word-break: break-word; }
  .person-group-count { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .person-group-subtotal { font-weight: 800; font-size: 15px; flex: 0 0 auto; }
  .person-entry-row {
    display: flex; align-items: center; gap: 6px; padding: 5px 0 5px 10px; font-size: 12px; color: var(--muted);
  }
  .person-entry-text { flex: 1; word-break: break-word; }
  .person-entry-pl { flex: 0 0 auto; font-weight: 700; min-width: 50px; text-align: right; }

  /* ---------------- bottom controls ---------------- */
  .controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, var(--bg) 78%, transparent);
    padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  .text-row { display: flex; gap: 8px; width: 100%; max-width: 480px; }
  .text-row input {
    flex: 1; background: var(--panel); border: 1px solid var(--gold); border-radius: 8px;
    color: var(--white); padding: 10px 12px; font-size: 15px;
  }
  .text-row button {
    background: linear-gradient(180deg, #FFE9A8, #D9A93A); color: #1a1400; border: none; border-radius: 8px;
    padding: 10px 16px; font-weight: 800; font-size: 14px;
  }
  #micBtn {
    width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--gold);
    background: var(--panel); color: var(--gold); font-size: 28px;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: none;
    box-shadow: 0 0 14px rgba(255, 216, 115, 0.25);
  }
  #micBtn.recording { background: var(--red); color: var(--white); border-color: var(--red);
    animation: micPulse 1s ease-in-out infinite; }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 10px rgba(255, 71, 87, 0.5); }
    50% { box-shadow: 0 0 24px rgba(255, 71, 87, 0.9); }
  }
  #micStatus { color: var(--muted); font-size: 12px; min-height: 16px; }

  .confirm-box {
    width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--gold);
    border-radius: 10px; padding: 10px; display: none; flex-direction: column; gap: 8px;
  }
  .confirm-box.show { display: flex; }
  .confirm-box input {
    background: var(--bg); border: 1px solid var(--muted); border-radius: 6px;
    color: var(--white); padding: 8px; font-size: 15px;
  }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions button { flex: 1; border: none; border-radius: 6px; padding: 8px; font-weight: bold; }
  .btn-confirm { background: var(--gold); color: #1a1400; }
  .btn-cancel { background: #2A2E4A; color: var(--white); }
  .noToken { text-align: center; color: var(--muted); padding: 40px 16px; }

  /* ---------------- modal overlay (confirm actions + day-end summary) ---------------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: linear-gradient(180deg, #171A38, #0B0E1A);
    border: 1px solid var(--gold); border-radius: 16px; padding: 20px;
    max-width: 420px; width: 100%; box-shadow: 0 0 34px rgba(255, 216, 115, 0.3);
    max-height: 80vh; overflow-y: auto;
  }
  .modal-title {
    color: var(--gold); font-weight: 800; font-size: 16px; margin-bottom: 4px;
    text-align: center; letter-spacing: 1.5px; text-transform: uppercase;
    text-shadow: 0 0 10px rgba(255, 216, 115, 0.4);
  }
  .modal-sub { text-align: center; color: var(--muted); font-size: 11px; margin-bottom: 14px; }
  .modal-msg { color: var(--white); font-size: 14px; margin-bottom: 18px; text-align: center; line-height: 1.6; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; border: none; border-radius: 8px; padding: 11px; font-weight: 800; font-size: 14px; }
  .modal-btn-confirm { background: linear-gradient(180deg, #FFE9A8, #D9A93A); color: #1a1400; }
  .modal-btn-cancel { background: #2A2E4A; color: var(--white); }
  .modal-btn-close { background: linear-gradient(180deg, #FFE9A8, #D9A93A); color: #1a1400; width: 100%; margin-top: 4px; }
  .summary-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed #2A2E4A; font-size: 14px; }
  .summary-total {
    display: flex; justify-content: space-between; padding-top: 12px; margin-top: 8px;
    border-top: 1px solid var(--gold); font-weight: 800; font-size: 17px; color: var(--gold);
    text-shadow: 0 0 8px rgba(255, 216, 115, 0.4);
  }
  .summary-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; }

  /* ---------------- payout checklist modal (after settling a match) ---------------- */
  .payout-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 0;
    border-bottom: 1px dashed #2A2E4A; font-size: 13px; cursor: pointer;
  }
  .payout-row:last-child { border-bottom: none; }
  .payout-row input[type="checkbox"] {
    width: 22px; height: 22px; flex: 0 0 auto; accent-color: var(--gold);
  }
  .payout-text { flex: 3; word-break: break-word; }
  .payout-name { flex: 2; color: var(--gold); text-align: right; word-break: break-word; font-size: 12px; }
  .payout-pl { flex: 0 0 auto; min-width: 58px; text-align: right; font-weight: 800; }
  .payout-row.checked { opacity: 0.45; }
  .payout-row.checked .payout-text { text-decoration: line-through; }
  #payoutContinueBtn:disabled { opacity: 0.35; }
</style>
</head>
<body>
  <div class="title-wrap">
    <div class="brand-title">OA LEDGER</div>
    <div class="brand-sub">Private Ledger Club</div>
    <div class="live-row"><span class="live-dot"></span>LIVE</div>
  </div>

  <div class="card" id="mainCard">
    <div class="pl-box">
      <div class="pl-label">ยอดได้เสียวันนี้</div>
      <div class="pl-value" id="plValue">0</div>
      <div class="session-label" id="sessionLabel"></div>
    </div>
    <hr />
    <div class="log-box">
      <div class="log-title" id="logTitle">บันทึกแผลเล่น</div>
      <div id="logList"><div class="empty">กำลังโหลด...</div></div>
    </div>
    <div class="footer-row">
      <span class="red" id="redWin">Redwin +0</span>
      <span class="blue" id="blueWin">Bluewin +0</span>
    </div>
  </div>

  <div class="action-panel" id="actionPanel">
    <div class="action-panel-title">คำสั่งควบคุมไฟต์</div>
    <div class="action-grid">
      <button class="action-btn start" id="btnST">ST</button>
      <button class="action-btn red" id="btnRed">/ด</button>
      <button class="action-btn blue" id="btnBlue">/น</button>
      <button class="action-btn draw" id="btnDraw">/สม</button>
      <button class="action-btn end" id="btnEnd">End</button>
    </div>
  </div>

  <button class="person-summary-btn" id="btnPersonSummary">📊 สรุปยอดรายบุคคล (รอบนี้)</button>

  <div class="controls">
    <div class="confirm-box" id="confirmBox">
      <input type="text" id="confirmText" />
      <div class="confirm-actions">
        <button class="btn-cancel" id="btnCancelVoice">ยกเลิก</button>
        <button class="btn-confirm" id="btnConfirm">✓ บันทึกแผลนี้</button>
      </div>
    </div>
    <div class="text-row">
      <input type="text" id="typeInput" placeholder="พิมพ์แผลเล่น เช่น 32ตด20000ชื่อ" />
      <button id="btnSend">ส่ง</button>
    </div>
    <button id="micBtn">🎤</button>
    <div id="micStatus"></div>
  </div>

  <!-- generic confirm modal, used for ST / settle / cancel-entry -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <div class="modal-title" id="confirmModalTitle">ยืนยัน</div>
      <div class="modal-msg" id="confirmModalMsg"></div>
      <div class="modal-actions">
        <button class="modal-btn-cancel" id="confirmModalNo">ยกเลิก</button>
        <button class="modal-btn-confirm" id="confirmModalYes">ยืนยัน</button>
      </div>
    </div>
  </div>

  <!-- day-end summary modal ("End") -->
  <div class="modal-overlay" id="endModal">
    <div class="modal-box">
      <div class="modal-title">สรุปยอดวันนี้</div>
      <div class="modal-sub" id="endDateLabel"></div>
      <div id="endFightList"></div>
      <div class="summary-total"><span>รวมสุทธิ</span><span id="endGrandTotal">+0</span></div>
      <button class="modal-btn-close" id="endModalClose">ปิด</button>
    </div>
  </div>

  <!-- payout checklist modal (shown right after settling /ด /น /สม, before moving to next match) -->
  <div class="modal-overlay" id="payoutModal">
    <div class="modal-box">
      <div class="modal-title" id="payoutTitle">สรุปคู่นี้</div>
      <div class="modal-sub" id="payoutSub">ติ๊กให้ครบทุกแผลก่อนไปคู่ถัดไป (กันลืมจ่าย/เก็บเงิน)</div>
      <div id="payoutList"></div>
      <div class="summary-total"><span>รวมคู่นี้</span><span id="payoutSubtotal">+0</span></div>
      <button class="modal-btn-close" id="payoutContinueBtn" disabled>ติ๊กให้ครบทุกแผลก่อน</button>
    </div>
  </div>

  <!-- rename modal — fix a mistranscribed/missing name on any entry (pending or already-settled) -->
  <div class="modal-overlay" id="renameModal">
    <div class="modal-box">
      <div class="modal-title">แก้ไข/เพิ่มชื่อ</div>
      <div class="rename-input-row">
        <input type="text" id="renameInput" placeholder="พิมพ์ชื่อลูกค้า" />
      </div>
      <div class="modal-actions">
        <button class="modal-btn-cancel" id="renameModalNo">ยกเลิก</button>
        <button class="modal-btn-confirm" id="renameModalYes">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- per-person summary modal (since last ST) — how many entries & net win/loss per customer -->
  <div class="modal-overlay" id="personSummaryModal">
    <div class="modal-box">
      <div class="modal-title">สรุปยอดรายบุคคล</div>
      <div class="modal-sub" id="personSummarySub">ตั้งแต่เริ่มรอบล่าสุด (ST)</div>
      <div id="personSummaryList"></div>
      <div class="summary-total"><span>รวมสุทธิ</span><span id="personSummaryGrandTotal">+0</span></div>
      <button class="modal-btn-close" id="personSummaryClose">ปิด</button>
    </div>
  </div>

<script>
// Supabase project base URL (the OA Ledger Bot project)
const SUPABASE_BASE = "https://gxmdrzzhhvyatvccatva.supabase.co";
const MONITOR_URL = SUPABASE_BASE + "/functions/v1/smart-action";
const SUBMIT_URL = SUPABASE_BASE + "/functions/v1/quick-function";
const STT_URL = SUPABASE_BASE + "/functions/v1/clever-worker";

const params = new URLSearchParams(window.location.search);
const TOKEN = params.get("g") || "";

const $ = (id) => document.getElementById(id);

if (!TOKEN) {
  document.body.innerHTML = '<div class="noToken">ลิงก์นี้ไม่ถูกต้อง (ไม่มี token) กรุณาขอลิงก์ใหม่จากแอดมินในกลุ่ม LINE ครับ</div>';
} else {
  init();
}

function fmtPl(n) {
  n = Number(n) || 0;
  return (n >= 0 ? "+" : "") + n;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// shows the bot's own compact notation (e.g. "61ตด4000") instead of the raw
// spoken/typed text, so the rate code is always clear at a glance and never
// gets lost or misread inside a longer sentence — falls back to raw_text if
// the row is missing rate_code/keyword/amount for any reason
function normalizeEntryText(e) {
  if (e.rate_code != null && e.keyword && e.amount != null) {
    return String(e.rate_code) + String(e.keyword) + String(e.amount);
  }
  return e.raw_text || "-";
}

function render(data) {
  if (!data.ok) {
    $("mainCard").innerHTML = '<div class="inactive">' + escapeHtml(data.error || "โหลดข้อมูลไม่สำเร็จ") + '</div>';
    $("actionPanel").style.display = "none";
    return;
  }
  if (data.active === false) {
    $("mainCard").innerHTML = '<div class="inactive">กลุ่มนี้ยังไม่เปิดใช้งาน หรือถูกปิดใช้งานอยู่ครับ</div>';
    $("actionPanel").style.display = "none";
    return;
  }
  $("actionPanel").style.display = "";
  $("plValue").textContent = fmtPl(data.todayTotal);
  $("plValue").style.color = Number(data.todayTotal) >= 0 ? "#F5F5F7" : "#F87171";
  $("sessionLabel").textContent = data.sessionLabel || "";
  $("logTitle").textContent = "บันทึกแผลเล่น • ไฟต์ " + data.fightNo;

  const entries = data.entries || [];
  let redWin = 0, blueWin = 0;
  const rows = entries.map((e) => {
    const win = Number(e.potential_win) || 0;
    const loss = Number(e.potential_loss) || 0;
    if (e.color === "red") { redWin += win; blueWin += -loss; }
    else { redWin += -loss; blueWin += win; }
    const dotClass = e.color === "red" ? "red" : "blue";
    const name = e.matched_name ? e.matched_name : "-";
    return '<div class="log-row"><span class="dot ' + dotClass + '">●</span>' +
      '<span class="log-text">' + escapeHtml(normalizeEntryText(e)) + '</span>' +
      '<span class="log-name">' + escapeHtml(name) + '</span>' +
      '<button class="edit-name-btn" data-edit-id="' + escapeHtml(e.id) + '" data-edit-name="' + escapeHtml(name === "-" ? "" : name) + '">✎</button>' +
      '<button class="cancel-entry-btn" data-cancel-id="' + escapeHtml(e.id) + '">ยกเลิก</button></div>';
  });
  $("logList").innerHTML = rows.length ? rows.join("") : '<div class="empty">ยังไม่มีแผลเล่นในไฟต์นี้</div>';
  $("redWin").textContent = "Redwin " + fmtPl(redWin);
  $("blueWin").textContent = "Bluewin " + fmtPl(blueWin);

  document.querySelectorAll("[data-cancel-id]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-cancel-id");
      showConfirmModal("ยกเลิกแผลนี้?", "แผลนี้จะถูกตัดออกจากบันทึก ยืนยันหรือไม่?", () => {
        submitAction({ type: "cancel", entryId: id }, "ยกเลิกแผลแล้ว ✓");
      });
    });
  });
  document.querySelectorAll("#logList [data-edit-id]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-edit-id");
      const nm = btn.getAttribute("data-edit-name");
      openRenameModal(id, nm, null); // poll() (below) already refreshes this list on success
    });
  });
}

async function poll() {
  try {
    const res = await fetch(MONITOR_URL + "?token=" + encodeURIComponent(TOKEN));
    const data = await res.json();
    render(data);
  } catch (e) {
    console.error(e);
  }
}

async function submitText(text) {
  if (!text || !text.trim()) return;
  $("micStatus").textContent = "กำลังบันทึก...";
  try {
    const res = await fetch(SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: TOKEN, type: "bet", text: text.trim() }),
    });
    const data = await res.json();
    if (!data.ok) {
      $("micStatus").textContent = data.error || "บันทึกไม่สำเร็จ";
      return;
    }
    $("micStatus").textContent = "บันทึกแล้ว ✓";
    poll();
  } catch (e) {
    $("micStatus").textContent = "เกิดข้อผิดพลาด ลองใหม่อีกครั้ง";
    console.error(e);
  }
}

// generic action submitter for cancel / start / settle / end
async function submitAction(payload, successStatus) {
  $("micStatus").textContent = "กำลังดำเนินการ...";
  try {
    const res = await fetch(SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: TOKEN, ...payload }),
    });
    const data = await res.json();
    if (!data.ok) {
      $("micStatus").textContent = data.error || "ดำเนินการไม่สำเร็จ";
      return;
    }
    if (payload.type === "end") {
      showEndModal(data);
      $("micStatus").textContent = "";
      return;
    }
    if (payload.type === "settle") {
      $("micStatus").textContent = "";
      showPayoutChecklist(data);
      return;
    }
    $("micStatus").textContent = successStatus || "สำเร็จ ✓";
    poll();
  } catch (e) {
    $("micStatus").textContent = "เกิดข้อผิดพลาด ลองใหม่อีกครั้ง";
    console.error(e);
  }
}

// ---------------- generic confirm modal ----------------
let pendingConfirmAction = null;
function showConfirmModal(title, msg, onYes) {
  $("confirmModalTitle").textContent = title;
  $("confirmModalMsg").textContent = msg;
  pendingConfirmAction = onYes;
  $("confirmModal").classList.add("show");
}
function hideConfirmModal() {
  $("confirmModal").classList.remove("show");
  pendingConfirmAction = null;
}

// ---------------- day-end summary modal ----------------
function showEndModal(data) {
  $("endDateLabel").textContent = data.dateLabel || "";
  const fights = data.fights || [];
  if (!fights.length) {
    $("endFightList").innerHTML = '<div class="summary-empty">ยังไม่มีไฟต์ที่สรุปผลวันนี้ครับ</div>';
  } else {
    $("endFightList").innerHTML = fights.map((f) =>
      '<div class="summary-row"><span>คู่ที่ ' + f.fightNo + '</span><span>' + fmtPl(f.subtotal) + '</span></div>'
    ).join("");
  }
  $("endGrandTotal").textContent = fmtPl(data.grandTotal);
  $("endGrandTotal").style.color = Number(data.grandTotal) >= 0 ? "var(--gold)" : "var(--loss)";
  $("endModal").classList.add("show");
}

// ---------------- payout checklist modal (shown right after settling a match) ----------------
function showPayoutChecklist(data) {
  const rows = data.settledRows || [];
  $("payoutTitle").textContent = "สรุปคู่ที่ " + (data.settledFightNo != null ? data.settledFightNo : "") + " — " + (data.resultLabel || "");

  let subtotal = 0;
  const html = rows.map((r, i) => {
    const pl = Number(r.actual_pl) || 0;
    subtotal += pl;
    const dotClass = r.color === "red" ? "red" : "blue";
    const name = r.matched_name ? r.matched_name : "-";
    const plColor = pl >= 0 ? "var(--gold)" : "var(--loss)";
    return '<label class="payout-row" data-row="' + i + '">' +
      '<input type="checkbox" class="payout-check" data-idx="' + i + '" />' +
      '<span class="dot ' + dotClass + '">●</span>' +
      '<span class="payout-text">' + escapeHtml(normalizeEntryText(r)) + '</span>' +
      '<span class="payout-name">' + escapeHtml(name) + '</span>' +
      '<button class="edit-name-btn" data-edit-id="' + escapeHtml(r.id) + '" data-edit-name="' + escapeHtml(name === "-" ? "" : name) + '">✎</button>' +
      '<span class="payout-pl" style="color:' + plColor + '">' + fmtPl(pl) + '</span>' +
      '</label>';
  }).join("");
  $("payoutList").innerHTML = html || '<div class="summary-empty">ไม่มีแผลในคู่นี้ครับ</div>';
  $("payoutSubtotal").textContent = fmtPl(subtotal);
  $("payoutSubtotal").style.color = subtotal >= 0 ? "var(--gold)" : "var(--loss)";

  const btn = $("payoutContinueBtn");
  const checkboxes = Array.from(document.querySelectorAll(".payout-check"));
  function updateBtn() {
    const allChecked = checkboxes.length === 0 || checkboxes.every((c) => c.checked);
    btn.disabled = !allChecked;
    btn.textContent = allChecked ? "ถัดไป (เริ่มคู่ใหม่)" : "ติ๊กให้ครบทุกแผลก่อน";
  }
  checkboxes.forEach((c) => {
    c.addEventListener("change", () => {
      const row = c.closest(".payout-row");
      if (row) row.classList.toggle("checked", c.checked);
      updateBtn();
    });
  });
  updateBtn();

  document.querySelectorAll("#payoutList [data-edit-id]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      // rows are <label> elements wrapping the checkbox -- stop the click
      // from also toggling it
      e.preventDefault();
      e.stopPropagation();
      const id = btn.getAttribute("data-edit-id");
      const nm = btn.getAttribute("data-edit-name");
      openRenameModal(id, nm, (newName) => {
        const row = btn.closest(".payout-row");
        const nameSpan = row ? row.querySelector(".payout-name") : null;
        if (nameSpan) nameSpan.textContent = newName;
        btn.setAttribute("data-edit-name", newName);
      });
    });
  });

  $("payoutModal").classList.add("show");
}

// ---------------- rename modal — fix a mistranscribed/missing name on any
// entry (pending or already-settled) ----------------
let renameTargetId = null;
let renameOnSaved = null;
function openRenameModal(entryId, currentName, onSaved) {
  renameTargetId = entryId;
  renameOnSaved = onSaved || null;
  $("renameInput").value = currentName || "";
  $("renameModal").classList.add("show");
  setTimeout(() => $("renameInput").focus(), 50);
}
function hideRenameModal() {
  $("renameModal").classList.remove("show");
  renameTargetId = null;
  renameOnSaved = null;
}
async function submitRename() {
  const name = $("renameInput").value.trim();
  if (!renameTargetId) { hideRenameModal(); return; }
  if (!name) { $("renameInput").focus(); return; }
  const idToRename = renameTargetId;
  const cb = renameOnSaved;
  try {
    const res = await fetch(SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: TOKEN, type: "rename", entryId: idToRename, name }),
    });
    const data = await res.json();
    hideRenameModal();
    if (!data.ok) {
      $("micStatus").textContent = data.error || "แก้ไขชื่อไม่สำเร็จ";
      return;
    }
    if (cb) cb(name);
    poll();
  } catch (e) {
    hideRenameModal();
    $("micStatus").textContent = "เกิดข้อผิดพลาด ลองใหม่อีกครั้ง";
    console.error(e);
  }
}

// ---------------- per-person summary modal (since last ST) ----------------
async function showPersonSummaryModal() {
  $("personSummaryList").innerHTML = '<div class="summary-empty">กำลังโหลด...</div>';
  $("personSummaryModal").classList.add("show");
  await loadPersonSummary();
}
async function loadPersonSummary() {
  try {
    const res = await fetch(SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: TOKEN, type: "personSummary" }),
    });
    const data = await res.json();
    if (!data.ok) {
      $("personSummaryList").innerHTML = '<div class="summary-empty">' + escapeHtml(data.error || "โหลดไม่สำเร็จ") + '</div>';
      return;
    }
    renderPersonSummary(data);
  } catch (e) {
    $("personSummaryList").innerHTML = '<div class="summary-empty">เกิดข้อผิดพลาด ลองใหม่อีกครั้ง</div>';
    console.error(e);
  }
}
function renderPersonSummary(data) {
  $("personSummarySub").textContent = data.sessionLabel || "ตั้งแต่เริ่มรอบล่าสุด (ST)";
  const people = data.people || [];
  if (!people.length) {
    $("personSummaryList").innerHTML = '<div class="summary-empty">ยังไม่มีแผลที่ประกาศผลในรอบนี้ครับ</div>';
  } else {
    $("personSummaryList").innerHTML = people.map((p) => {
      const subColor = Number(p.subtotal) >= 0 ? "var(--gold)" : "var(--loss)";
      const nameForEdit = p.name === "ไม่ระบุชื่อ" ? "" : p.name;
      const entriesHtml = (p.entries || []).map((r) => {
        const pl = Number(r.actual_pl) || 0;
        const plColor = pl >= 0 ? "var(--gold)" : "var(--loss)";
        return '<div class="person-entry-row">' +
          '<span class="person-entry-text">' + escapeHtml(normalizeEntryText(r)) + '</span>' +
          '<button class="edit-name-btn" data-edit-id="' + escapeHtml(r.id) + '" data-edit-name="' + escapeHtml(nameForEdit) + '">✎</button>' +
          '<span class="person-entry-pl" style="color:' + plColor + '">' + fmtPl(pl) + '</span>' +
          '</div>';
      }).join("");
      return '<div class="person-group">' +
        '<div class="person-group-header">' +
          '<span class="person-group-name">' + escapeHtml(p.name) + '<span class="person-group-count">(' + p.count + ' แผล)</span></span>' +
          '<span class="person-group-subtotal" style="color:' + subColor + '">' + fmtPl(p.subtotal) + '</span>' +
        '</div>' +
        entriesHtml +
        '</div>';
    }).join("");
  }
  $("personSummaryGrandTotal").textContent = fmtPl(data.grandTotal);
  $("personSummaryGrandTotal").style.color = Number(data.grandTotal) >= 0 ? "var(--gold)" : "var(--loss)";

  document.querySelectorAll("#personSummaryList [data-edit-id]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-edit-id");
      const nm = btn.getAttribute("data-edit-name");
      openRenameModal(id, nm, () => {
        // re-fetch + re-render so entries regroup under the corrected name
        loadPersonSummary();
      });
    });
  });
}

function init() {
  poll();
  setInterval(poll, 4000);

  $("btnSend").addEventListener("click", () => {
    const v = $("typeInput").value;
    $("typeInput").value = "";
    submitText(v);
  });
  $("typeInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("btnSend").click();
  });

  $("btnCancelVoice").addEventListener("click", () => {
    $("confirmBox").classList.remove("show");
  });
  $("btnConfirm").addEventListener("click", () => {
    const v = $("confirmText").value;
    $("confirmBox").classList.remove("show");
    submitText(v);
  });

  // --- ST / /ด / /น / /สม / End buttons (mirror LINE commands) ---
  $("btnST").addEventListener("click", () => {
    showConfirmModal("เริ่มรอบใหม่ (ST)", "ยอดได้เสียวันนี้จะเริ่มนับใหม่จากตอนนี้ เริ่มไฟต์ 1 ยืนยันหรือไม่?", () => {
      submitAction({ type: "start" }, "เริ่มรอบใหม่แล้ว 🥊");
    });
  });
  $("btnRed").addEventListener("click", () => {
    showConfirmModal("สรุปผล: แดงชนะ", "ยืนยันผลไฟต์นี้เป็น แดงชนะ ใช่หรือไม่?", () => {
      submitAction({ type: "settle", result: "red" }, "สรุปผล แดงชนะ ✓");
    });
  });
  $("btnBlue").addEventListener("click", () => {
    showConfirmModal("สรุปผล: น้ำเงินชนะ", "ยืนยันผลไฟต์นี้เป็น น้ำเงินชนะ ใช่หรือไม่?", () => {
      submitAction({ type: "settle", result: "blue" }, "สรุปผล น้ำเงินชนะ ✓");
    });
  });
  $("btnDraw").addEventListener("click", () => {
    showConfirmModal("สรุปผล: เสมอ", "ยืนยันผลไฟต์นี้เป็น เสมอ ใช่หรือไม่?", () => {
      submitAction({ type: "settle", result: "draw" }, "สรุปผล เสมอ ✓");
    });
  });
  $("btnEnd").addEventListener("click", () => {
    submitAction({ type: "end" });
  });
  $("btnPersonSummary").addEventListener("click", () => {
    showPersonSummaryModal();
  });

  $("renameModalNo").addEventListener("click", hideRenameModal);
  $("renameModalYes").addEventListener("click", submitRename);
  $("renameInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitRename();
  });
  $("personSummaryClose").addEventListener("click", () => {
    $("personSummaryModal").classList.remove("show");
  });

  $("confirmModalNo").addEventListener("click", hideConfirmModal);
  $("confirmModalYes").addEventListener("click", () => {
    const action = pendingConfirmAction;
    hideConfirmModal();
    if (action) action();
  });
  $("endModalClose").addEventListener("click", () => {
    $("endModal").classList.remove("show");
  });
  $("payoutContinueBtn").addEventListener("click", () => {
    if ($("payoutContinueBtn").disabled) return;
    $("payoutModal").classList.remove("show");
    poll();
  });

  // --- press-and-hold voice recording ---
  let mediaRecorder = null;
  let chunks = [];
  let recording = false;

  async function startRecording() {
    if (recording) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      // Safari (incl. iPhone / the LINE in-app browser) does not support
      // recording audio/webm at all -- it silently records audio/mp4 (AAC)
      // instead. Ask for webm/opus first since that's what most browsers
      // use, but fall back to whatever the browser actually supports so we
      // never end up mislabeling the real format later.
      const PREFERRED_MIME_TYPES = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac"];
      const chosenMimeType = PREFERRED_MIME_TYPES.find(
        (t) => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t),
      );
      mediaRecorder = chosenMimeType ? new MediaRecorder(stream, { mimeType: chosenMimeType }) : new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        // Use the mimeType the recorder ACTUALLY produced, not a hardcoded
        // guess -- on Safari this is audio/mp4 even though we asked for
        // webm/opus above, and mislabeling the blob as webm makes the STT
        // backend fail to decode it (this was the iPhone "STT ล้มเหลว" bug).
        const actualMimeType = mediaRecorder.mimeType || "audio/webm";
        const ext = actualMimeType.includes("mp4")
          ? "mp4"
          : actualMimeType.includes("aac")
          ? "aac"
          : actualMimeType.includes("ogg")
          ? "ogg"
          : "webm";
        const blob = new Blob(chunks, { type: actualMimeType });
        if (blob.size < 500) {
          $("micStatus").textContent = "ไม่ได้ยินเสียงครับ ลองใหม่อีกครั้ง";
          return;
        }
        $("micStatus").textContent = "กำลังถอดเสียง...";
        const form = new FormData();
        form.append("audio", blob, `clip.${ext}`);
        try {
          const res = await fetch(STT_URL, { method: "POST", body: form });
          const data = await res.json();
          if (!data.ok || !data.text) {
            $("micStatus").textContent = data.error || "ถอดเสียงไม่สำเร็จ ลองใหม่อีกครั้ง";
            return;
          }
          $("micStatus").textContent = "";
          $("confirmText").value = data.text;
          $("confirmBox").classList.add("show");
        } catch (e) {
          $("micStatus").textContent = "เกิดข้อผิดพลาด ลองใหม่อีกครั้ง";
          console.error(e);
        }
      };
      mediaRecorder.start();
      recording = true;
      $("micBtn").classList.add("recording");
      $("micStatus").textContent = "กำลังบันทึกเสียง...";
    } catch (e) {
      $("micStatus").textContent = "ไม่สามารถเข้าถึงไมโครโฟนได้ครับ";
      console.error(e);
    }
  }

  function stopRecording() {
    if (!recording) return;
    recording = false;
    $("micBtn").classList.remove("recording");
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  }

  const micBtn = $("micBtn");
  micBtn.addEventListener("mousedown", startRecording);
  micBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); }, { passive: false });
  micBtn.addEventListener("mouseup", stopRecording);
  micBtn.addEventListener("mouseleave", stopRecording);
  micBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopRecording(); }, { passive: false });
  micBtn.addEventListener("touchcancel", stopRecording);
}
</script>
